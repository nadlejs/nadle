packages:
  - ./packages/**
  - "!**/__temp__/**"
  - "!**/__fixtures__/**"
  - "!./packages/sample-app"
  - "!./packages/examples/**"
  - "!./packages/vscode-extension/server"

# Exact exclusions for versions that must install before the default 24h minimumReleaseAge passes.
minimumReleaseAgeExclude:
  - "@nadle/kernel@0.0.2"
  - "@nadle/project-resolver@0.0.3"
  - nadle@0.6.0
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0

# Only esbuild needs its install script; the rest were silently skipped
# under pnpm 10 as well and work fine without building.
allowBuilds:
  "@vscode/vsce-sign": false
  core-js: false
  esbuild: true
  keytar: false

overrides:
  "@vitest/pretty-format": 3.1.2
  "webpack-dev-server@<=5.2.0": ">=5.2.1"
  "brace-expansion@>=1.0.0 <=1.1.11": ">=2.x"
  "qs@>=6.0.0 <6.14.2": 6.14.2
  "markdown-it@>=13.0.0 <14.1.1": 14.1.1
  "webpack@>=5.49.0 <5.104.1": 5.104.1
  "lodash-es@>=4.0.0 <=4.17.22": 4.17.23
  "mdast-util-to-hast@>=13.0.0 <13.2.1": 13.2.1
  "node-forge@<1.3.2": 1.3.2
  "js-yaml@>=4.0.0 <4.1.1": 4.1.1
  "js-yaml@>=3.0.0 <3.14.2": 3.14.2
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

# Vite+ bundles its own vitest build; the catalog keeps every package on that one version.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
  "@vitest/coverage-v8": 5.1.1
  "@vitest/expect": 5.1.1

peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
