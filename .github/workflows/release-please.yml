name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Keep release PRs as draft
        if: always()
        run: |
          # Release PRs are kept as draft so CI skips them until a human marks
          # them ready. Log failures instead of swallowing them: a silent failure
          # here leaves release PRs open and CI-eligible without anyone noticing.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number,isDraft \
            --jq '.[] | select(.isDraft == false) | .number')

          if [ -z "$prs" ]; then
            echo "No non-draft release PRs found."
            exit 0
          fi

          for pr in $prs; do
            if gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" --undo; then
              echo "Converted PR #$pr back to draft."
            else
              echo "::warning::Failed to convert PR #$pr to draft."
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
