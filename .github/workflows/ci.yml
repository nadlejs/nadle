name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job dependency graph (every heavy job also waits on `changes`, which skips them
# for docs-only changes; `status` is the only source of the required "CI Status" check):
#
#   check (lint + typecheck + API surface) ─────────────┐
#                                                        │
#           ┌── test (Ubuntu 22, shards 1..3) ──────────┤
#           ├── test (macOS 22, shards 1..3) ───────────┤
#   build ──┼── test (Windows 22, shards 1..3) ─────────┼── status
#           └── test (Ubuntu 24, shards 1..3) ──────────┤
#                                                        │
#   (release-any-commit runs independently)  ───────────┘
#
# build no longer typechecks or verifies the API surface — those moved to the
# check job so they run in parallel instead of extending the build→test path.
# The nadle suite (the slow leg) is split across 3 shards via vitest --shard.

jobs:
  # Docs-only = every changed file matches "*.md" (repo root), "packages/docs/**" or
  # "LICENSE". Decided here, not by a paths filter, which matches when ANY file matches.
  changes:
    name: Changes
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      - name: Detect docs-only change
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_docs() {
            case "$1" in
              LICENSE | packages/docs/*) return 0 ;;
              */*) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Unknown diff (merge queue, new branch, API error) means run everything.
          docs_only=false
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          elif [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
              --jq '.files[] | .filename, (.previous_filename // empty)') || files=""
          fi
          if [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r path; do
              is_docs "$path" || docs_only=false
            done <<< "$files"
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [changes]
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build
        run: nadle build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            packages/kernel/lib
            packages/project-resolver/lib
            packages/nadle/lib
            packages/eslint-plugin/lib
            packages/create-nadle/lib
          retention-days: 1

  check:
    name: Lint
    needs: [changes]
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Restore lint caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/cspell
          key: lint-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lint-cache-${{ runner.os }}-

      - name: Check
        run: nadle check

      # typecheck + the API-surface tasks both depend on the package build, so
      # run them together — nadle dedupes the shared build within one invocation.
      - name: Typecheck and verify API surface
        run: nadle typecheck packages:nadle:testNoWarningsAndUndocumentedAPI

  test:
    name: Test Node ${{ matrix.node-version }} on ${{ matrix.os }} (shard ${{ matrix.shard }}/3)
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    needs: [changes, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # bash everywhere: PowerShell strips the bare `--` separator that nadle
    # needs for passthrough args.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # The oldest supported Node on every OS; each newer LTS on ubuntu only.
        node-version: ["22"]
        shard: [1, 2, 3]
        include:
          - os: ubuntu-latest
            node-version: "24"
            shard: 1
          - os: ubuntu-latest
            node-version: "24"
            shard: 2
          - os: ubuntu-latest
            node-version: "24"
            shard: 3
          - os: ubuntu-latest
            node-version: "26"
            shard: 1
          - os: ubuntu-latest
            node-version: "26"
            shard: 2
          - os: ubuntu-latest
            node-version: "26"
            shard: 3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: packages

      # The nadle suite dominates wall-clock, so split it across shards. The small
      # packages run once (on shard 1) instead of redundantly on every shard.
      - name: Test nadle
        run: nadle testUnit -- --project nadle --shard=${{ matrix.shard }}/3

      - name: Test other packages
        if: ${{ matrix.shard == 1 }}
        run: nadle testUnit -- --project kernel --project project-resolver --project eslint-plugin --project create-nadle --project language-server

  size-limit:
    name: Size Limit
    needs: [changes]
    if: ${{ github.event.pull_request.draft != true && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package: [nadle, create-nadle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build
        run: nadle compile bundle

      - name: Run Size Limit
        run: pnpm --filter ./packages/${{ matrix.package }} exec size-limit

  status:
    name: CI Status
    needs: [changes, check, build, test, size-limit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        if: |
          (needs.changes.result == 'failure' || needs.changes.result == 'cancelled') ||
          (needs.check.result == 'failure' || needs.check.result == 'cancelled') ||
          (needs.build.result == 'failure' || needs.build.result == 'cancelled') ||
          (needs.test.result == 'failure' || needs.test.result == 'cancelled') ||
          (needs.size-limit.result == 'failure' || needs.size-limit.result == 'cancelled')
        run: exit 1
